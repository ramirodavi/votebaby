<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá Revelação - Votação</title>
    <meta name="description" content="Menino ou menina? Vote no sexo do bebê, deixe seu recado e acompanhe o resultado ao vivo!">
    <!-- Atualizada em scripts.js com a cor de fundo vinda do /config -->
    <meta name="theme-color" content="#e7b3df">

    <!-- Prévia do link (WhatsApp e redes sociais): URLs absolutas do GitHub Pages -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Votebaby">
    <meta property="og:title" content="Chá Revelação — Menino ou menina?">
    <meta property="og:description" content="Vote no sexo do bebê, deixe seu recado e acompanhe o resultado ao vivo! 🎈">
    <meta property="og:url" content="https://ramirodavi.github.io/votebaby/frontend/">
    <meta property="og:image" content="https://ramirodavi.github.io/votebaby/frontend/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Chá Revelação: menino ou menina? Vote!">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="balloon-container"></div>

    <main class="page">
        <div class="topbar">
            <div id="connection-status" class="connection-status" data-state="connecting" role="status" aria-live="polite">Conectando…</div>
        </div>
        <div id="revelacao" class="revelacao"></div>

        <div class="vote-section">
            <h1>Chá Revelação</h1>
            <h2>Vote no sexo do bebê!</h2>
            <div class="input-container">
                <input type="text" id="name-input" placeholder="Digite seu nome antes de votar..." maxlength="100">
            </div>
            <div class="buttons">
                <button class="boy-btn" onclick="vote('boy')">Menino</button>
                <button class="girl-btn" onclick="vote('girl')">Menina</button>
            </div>
            <div class="vote-count">
                <div class="boy-name"><strong>Menino:</strong> <span id="boy-count">0</span></div>
                <div class="name-separator"><strong>|</strong></div>
                <div class="girl-name"><strong>Menina:</strong> <span id="girl-count">0</span></div>
            </div>
            <div class="progress-container">
                <div id="boy-bar" class="progress-bar boy-bar">0%</div>
                <div id="girl-bar" class="progress-bar girl-bar">0%</div>
            </div>
        </div>

        <div class="log-container">
            <h3>🗳️ Histórico de votos</h3>
            <div class="vote-log" id="log"></div>
        </div>
        <div class="comment-container">
            <h3>💬 Comentários</h3>
            <form id="comment-form" class="comment-form">
                <input type="text" id="comment-name" placeholder="Seu nome" maxlength="100" required>
                <textarea id="comment-message" placeholder="Digite seu comentário..." maxlength="500" required></textarea>
                <button type="submit">Enviar</button>
            </form>
            <div class="comment-log" id="comment-log"></div>
        </div>
    </main>

    <div id="context-menu" class="context-menu" hidden role="menu">
        <button type="button" class="context-menu-item" data-context-action="edit">Alterar</button>
        <button type="button" class="context-menu-item" data-context-action="delete">Excluir</button>
    </div>

    <div id="modal-edit-vote" class="modal-overlay" hidden>
        <div class="modal-dialog" role="dialog" aria-labelledby="modal-edit-vote-title">
            <h3 id="modal-edit-vote-title">Alterar voto</h3>
            <p class="modal-hint">Escolha o novo voto:</p>
            <div class="buttons modal-buttons">
                <button type="button" class="boy-btn" id="modal-vote-boy">Menino</button>
                <button type="button" class="girl-btn" id="modal-vote-girl">Menina</button>
            </div>
            <button type="button" class="modal-cancel-btn" id="modal-vote-cancel">Cancelar</button>
        </div>
    </div>

    <div id="modal-edit-comment" class="modal-overlay" hidden>
        <div class="modal-dialog" role="dialog" aria-labelledby="modal-edit-comment-title">
            <h3 id="modal-edit-comment-title">Editar comentário</h3>
            <input type="text" id="modal-comment-name" placeholder="Seu nome" autocomplete="name" maxlength="100">
            <textarea id="modal-comment-message" placeholder="Digite seu comentário..." maxlength="500"></textarea>
            <button type="button" class="modal-primary-btn" id="modal-comment-save">Atualizar</button>
            <button type="button" class="modal-cancel-btn" id="modal-comment-cancel">Cancelar</button>
        </div>
    </div>

    <script src="./js/scripts.js"></script>      
</body>
</html>
