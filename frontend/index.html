<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá Revelação - Votação</title>
    <meta name="description" content="Menino ou menina? Vote no sexo do bebê, deixe seu recado e acompanhe o resultado ao vivo!">
    <!-- Atualizada em scripts.js com a cor de fundo vinda do /config -->
    <meta name="theme-color" content="#e7b3df">

    <!-- Prévia do link (WhatsApp e redes sociais): URLs absolutas do GitHub Pages -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Votebaby">
    <meta property="og:title" content="Chá Revelação — Menino ou menina?">
    <meta property="og:description" content="Vote no sexo do bebê, deixe seu recado e acompanhe o resultado ao vivo! 🎈">
    <meta property="og:url" content="https://ramirodavi.github.io/votebaby/frontend/">
    <meta property="og:image" content="https://ramirodavi.github.io/votebaby/frontend/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Chá Revelação: menino ou menina? Vote!">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Tela de carregamento: visível desde o primeiro instante; scripts.js esconde ao receber o /config -->
    <div id="splash" class="splash" role="status" aria-live="polite">
        <div class="splash-content">
            <div class="splash-balloons" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
            <p class="splash-title" id="splash-title">Preparando a festa… 🎈</p>
            <p class="splash-hint" id="splash-hint" hidden></p>
            <button type="button" class="splash-retry" id="splash-retry" hidden>Tentar novamente</button>
        </div>
    </div>

    <div class="balloon-container"></div>

    <main class="page">
        <div class="topbar">
            <div id="connection-status" class="connection-status" data-state="connecting" role="status" aria-live="polite">Conectando…</div>
        </div>
        <div id="revelacao" class="revelacao"></div>

        <div class="vote-section is-loading">
            <h1>Chá Revelação</h1>
            <h2>Vote no sexo do bebê!</h2>
            <!-- Enter no nome não vota (falta escolher o time): leva o foco para os botões -->
            <form id="vote-form" class="vote-form">
                <div class="input-container">
                    <input type="text" id="name-input" placeholder="Digite seu nome antes de votar..." maxlength="100"
                        aria-label="Seu nome" autocomplete="name" enterkeyhint="done">
                </div>
                <div class="buttons">
                    <button type="button" class="boy-btn" id="vote-boy" aria-pressed="false">Menino</button>
                    <button type="button" class="girl-btn" id="vote-girl" aria-pressed="false">Menina</button>
                </div>
                <p id="my-vote" class="my-vote" role="status" hidden></p>
            </form>
            <div class="scoreboard" aria-live="polite" aria-atomic="true">
                <div class="team team--boy">
                    <span class="team-label">Time <span id="boy-team-name">Menino</span></span>
                    <span class="team-count" id="boy-count">0</span>
                </div>
                <div class="versus" aria-hidden="true">×</div>
                <div class="team team--girl">
                    <span class="team-label">Time <span id="girl-team-name">Menina</span></span>
                    <span class="team-count" id="girl-count">0</span>
                </div>
            </div>
            <!-- Percentual dentro de cada parte da barra (oculto quando a parte é estreita demais) -->
            <div class="progress-container" id="progress" role="img" aria-label="Nenhum voto ainda">
                <div id="boy-bar" class="progress-bar boy-bar"></div>
                <div id="girl-bar" class="progress-bar girl-bar"></div>
            </div>
            <p class="score-status" id="score-status">Nenhum voto ainda</p>
            <!-- Só no modo telão (?telao=1): QR Code para os convidados abrirem a página no celular -->
            <div class="qr-card" id="qr-card" hidden>
                <div class="qr-code" id="qr-code" aria-hidden="true"></div>
                <div>
                    <p class="qr-title" id="qr-title">Vote pelo celular! 📱</p>
                    <p class="qr-url" id="qr-url"></p>
                </div>
            </div>
        </div>

        <div class="log-container">
            <h3 id="log-title">🗳️ Histórico de votos</h3>
            <div class="vote-log" id="log">
                <!-- Esqueletos até os votos chegarem (substituídos por updateUI) -->
                <div class="skeleton skeleton--chip"></div>
                <div class="skeleton skeleton--chip"></div>
                <div class="skeleton skeleton--chip"></div>
                <div class="skeleton skeleton--chip"></div>
            </div>
        </div>
        <div class="comment-container">
            <h3 id="comment-title">💬 Comentários</h3>
            <form id="comment-form" class="comment-form">
                <input type="text" id="comment-name" placeholder="Seu nome" maxlength="100" required
                    aria-label="Seu nome" autocomplete="name">
                <textarea id="comment-message" placeholder="Digite seu comentário..." maxlength="500" required
                    aria-label="Comentário"></textarea>
                <button type="submit">Enviar</button>
            </form>
            <div class="comment-log" id="comment-log">
                <!-- Esqueletos até os comentários chegarem (substituídos por updateCommentUI) -->
                <div class="skeleton skeleton--card"></div>
                <div class="skeleton skeleton--card"></div>
            </div>
        </div>
    </main>

    <div id="context-menu" class="context-menu" hidden role="menu">
        <button type="button" class="context-menu-item" data-context-action="edit">Alterar</button>
        <button type="button" class="context-menu-item" data-context-action="delete">Excluir</button>
    </div>

    <div id="modal-edit-vote" class="modal-overlay" hidden>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-edit-vote-title">
            <h3 id="modal-edit-vote-title">Alterar voto</h3>
            <p class="modal-hint">Escolha o novo voto:</p>
            <div class="buttons modal-buttons">
                <button type="button" class="boy-btn" id="modal-vote-boy">Menino</button>
                <button type="button" class="girl-btn" id="modal-vote-girl">Menina</button>
            </div>
            <button type="button" class="modal-cancel-btn" id="modal-vote-cancel">Cancelar</button>
        </div>
    </div>

    <div id="modal-edit-comment" class="modal-overlay" hidden>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-edit-comment-title">
            <h3 id="modal-edit-comment-title">Editar comentário</h3>
            <input type="text" id="modal-comment-name" placeholder="Seu nome" autocomplete="name" maxlength="100" aria-label="Seu nome">
            <textarea id="modal-comment-message" placeholder="Digite seu comentário..." maxlength="500" aria-label="Comentário"></textarea>
            <button type="button" class="modal-primary-btn" id="modal-comment-save">Atualizar</button>
            <button type="button" class="modal-cancel-btn" id="modal-comment-cancel">Cancelar</button>
        </div>
    </div>

    <div id="modal-confirm" class="modal-overlay" hidden>
        <div class="modal-dialog" role="alertdialog" aria-modal="true" aria-labelledby="modal-confirm-title" aria-describedby="modal-confirm-message">
            <h3 id="modal-confirm-title">Tem certeza?</h3>
            <p class="modal-hint" id="modal-confirm-message"></p>
            <button type="button" class="modal-danger-btn" id="modal-confirm-ok">Excluir</button>
            <button type="button" class="modal-cancel-btn" id="modal-confirm-cancel">Cancelar</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Sequência da revelação (primeira visita após revelar): contagem, cor do resultado e frase -->
    <div id="reveal-show" class="reveal-show" hidden role="alert" aria-live="assertive">
        <p class="reveal-show-count" id="reveal-show-count"></p>
        <div class="reveal-show-result" id="reveal-show-result" hidden>
            <p class="reveal-show-title" id="reveal-show-title"></p>
            <p class="reveal-show-text" id="reveal-show-text"></p>
        </div>
        <p class="reveal-show-skip">Toque para pular</p>
    </div>

    <script src="./js/scripts.js"></script>      
</body>
</html>
